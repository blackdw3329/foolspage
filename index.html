<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I Love You Heart</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
    }

    body {
        overflow: hidden;
        background: #000;
        font-family: Arial, Helvetica, sans-serif;
    }

    .scene {
        width: 100%;
        height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background:
            radial-gradient(
                circle at center,
                rgba(255, 70, 160, 0.06),
                transparent 50%
            ),
            #000;
    }

    #heart {
        position: relative;

        width: min(90vw, 850px);
        height: min(90vw, 850px);

        transform-origin: center;

        animation: breathe 4s ease-in-out infinite;
    }

    .love-row {
        position: absolute;

        left: 50%;
        top: 50%;

        white-space: nowrap;

        transform-origin: center center;

        pointer-events: none;

        will-change:
            left,
            top,
            transform,
            opacity,
            filter;
    }

    .love-word {
        display: inline-block;

        color: #ec91be;

        font-size: clamp(
            14px,
            2vw,
            24px
        );

        font-weight: 500;

        letter-spacing: 0.3px;

        white-space: nowrap;

        text-shadow:
            0 0 2px rgba(255,255,255,0.9),
            0 0 5px rgba(255,180,220,0.9),
            0 0 10px rgba(255,90,180,0.8),
            0 0 20px rgba(255,50,150,0.45);
    }

    @keyframes breathe {
        0%,
        100% {
            transform: scale(0.98);
        }

        50% {
            transform: scale(1.025);
        }
    }

    @media (max-width: 600px) {
        #heart {
            width: 98vw;
            height: 98vw;
        }

        .love-word {
            font-size: clamp(
                12px,
                4vw,
                18px
            );
        }
    }
</style>
</head>

<body>

<div class="scene">
    <div id="heart"></div>
</div>


<script>

const heart =
    document.getElementById("heart");


/*
========================================

설정

========================================
*/


// 하트 회전 속도
const ROTATION_SPEED = 0.35;


// 하트 가로 크기
const HEART_WIDTH = 2.35;


// 하트 세로 크기
const HEART_HEIGHT = 2.45;


/*
========================================

하트 좌표

========================================
*/

function getHeartPoint(t) {

    const x =
        16 *
        Math.pow(
            Math.sin(t),
            3
        );


    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);


    return {
        x,
        y
    };
}


/*
========================================

I love you 딱 1개 생성

========================================
*/

const row =
    document.createElement("div");


row.className =
    "love-row";


const word =
    document.createElement("span");


word.className =
    "love-word";


word.textContent =
    "I love you";


row.appendChild(word);

heart.appendChild(row);


/*
========================================

애니메이션

========================================
*/

let previousTime =
    performance.now();


let rotation = 0;


function animate(currentTime) {

    /*
    FPS에 관계없이 일정한 속도로 이동
    */

    const deltaTime =
        (
            currentTime -
            previousTime
        )
        /
        1000;


    previousTime =
        currentTime;


    /*
    하트 경로를 따라 계속 이동
    */

    rotation +=
        ROTATION_SPEED *
        deltaTime;


    /*
    현재 하트 위치
    */

    const t =
        rotation;


    const p =
        getHeartPoint(t);


    /*
    아주 조금 앞의 위치

    글자의 방향 계산용
    */

    const next =
        getHeartPoint(
            t + 0.015
        );


    /*
    화면 좌표
    */

    const left =
        50 +
        p.x *
        HEART_WIDTH;


    const top =
        50 -
        p.y *
        HEART_HEIGHT;


    /*
    현재 하트 곡선의 진행 방향
    */

    const dx =
        next.x -
        p.x;


    const dy =
        next.y -
        p.y;


    let angle =
        Math.atan2(
            -dy,
            dx
        )
        *
        180 /
        Math.PI;


    /*
    글자가 거꾸로 뒤집히지 않게 처리
    */

    while (angle > 90) {

        angle -= 180;

    }


    while (angle < -90) {

        angle += 180;

    }


    /*
    1.0 = 하트 방향 그대로 회전
    0.0 = 항상 수평

    살짝만 회전
    */

    angle *= 0.55;


    /*
    ========================================

    원근감

    ========================================
    */

    const depth =
        (
            Math.sin(
                t +
                Math.PI / 4
            )
            +
            1
        )
        /
        2;


    /*
    앞쪽에서는 조금 크게
    */

    const scale =
        0.72 +
        depth *
        0.55;


    /*
    뒤쪽에서는 조금 흐리게
    */

    const opacity =
        0.35 +
        depth *
        0.65;


    /*
    뒤쪽 blur
    */

    const blur =
        (
            1 -
            depth
        )
        *
        1.5;


    /*
    위치 적용
    */

    row.style.left =
        left + "%";


    row.style.top =
        top + "%";


    /*
    회전 + 크기
    */

    row.style.transform =
        `
        translate(-50%, -50%)
        rotate(${angle}deg)
        scale(${scale})
        `;


    /*
    투명도
    */

    row.style.opacity =
        opacity;


    /*
    흐림 + 밝기
    */

    row.style.filter =
        `
        blur(${blur}px)
        brightness(${0.9 + depth * 0.6})
        `;


    requestAnimationFrame(
        animate
    );
}


requestAnimationFrame(
    animate
);

</script>

</body>
</html>
